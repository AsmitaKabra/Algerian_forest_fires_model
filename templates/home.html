<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forest Fire Prediction</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body style="background: linear-gradient(to right, #141e30, #243b55); min-height:100vh;">

    <div class="container py-5">

        <div class="card shadow-lg p-4 mx-auto"
            style="max-width:650px; border-radius:20px;">

            <h1 class="text-center text-primary mb-4">
                Forest Fire Prediction
            </h1>

            <form action="/predictdata" method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <input type="number" step="any"
                            class="form-control"
                            name="Temperature"
                            placeholder="Temperature"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <input type="number" step="any"
                            class="form-control"
                            name="RH"
                            placeholder="Relative Humidity (RH)"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <input type="number" step="any"
                            class="form-control"
                            name="Ws"
                            placeholder="Wind Speed (Ws)"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <input type="number" step="any"
                            class="form-control"
                            name="Rain"
                            placeholder="Rain"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <input type="number" step="any"
                            class="form-control"
                            name="FFMC"
                            placeholder="FFMC"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <input type="number" step="any"
                            class="form-control"
                            name="DMC"
                            placeholder="DMC"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <input type="number" step="any"
                            class="form-control"
                            name="ISI"
                            placeholder="ISI"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <input type="number" step="any"
                            class="form-control"
                            name="Classes"
                            placeholder="Classes"
                            required>
                    </div>

                    <div class="col-md-12 mb-4">
                        <input type="number" step="any"
                            class="form-control"
                            name="Region"
                            placeholder="Region"
                            required>
                    </div>

                </div>

                <div class="d-grid">
                    <button type="submit"
                        class="btn btn-primary btn-lg">
                        Predict Fire Risk
                    </button>
                </div>

            </form>

            {% if results %}

            <div class="mt-4 text-center">

                <div class="alert alert-success">

                    <h4 class="mb-3">
                        Prediction Result
                    </h4>

                    <h2>
                        {{ results }}
                    </h2>

                    <h3 class="mt-3">
                        {{ risk }}
                    </h3>

                </div>

            </div>

            {% endif %}

        </div>

    </div>

</body>

</html>
